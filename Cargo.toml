[package]
name = "FreagleMail"
version = "0.1.0"
edition = "2024"
authors = ["Zytronium <zytronium@zytronium.dev>"]
description = "Browse and send email at lightspeed with Freagle Mail — the most American email client"
repository = "https://github.com/Zytronium/PhotonMail"
homepage = "https://photonmail.zytronium.dev"
license = "MIT"
keywords = ["email", "mail-client", "gui", "freya"]
categories = ["gui"]
rust-version = "1.85"

[dependencies]
base64 = "0.22"
freya = { version = "0.5.2", features = ["borderless", "titlebar", "engine", "html"] }
freya-components = "0.5.2"
freya-html = "0.5.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2"
open = "5"
regex = "1"
rodio = "0.18"
rfd = "0.17.2"
url = "2"

# --- mail backend ---
async-channel = "2"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
dirs = "6"
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-timer = "3"
# Password storage in the OS keyring. On Linux this uses Secret Service over D-Bus
# (needs libdbus at build time; on Arch/CachyOS the `dbus` package has it).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
# `ring` provider + bundled Mozilla roots: no C toolchain, no system OpenSSL.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# SMTP email sending — uses tokio1 + rustls (ring) + webpki-roots to match the existing TLS setup
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "ring", "builder", "hostname", "webpki-roots"] }
# DNS resolver for auto-discovering email server settings (MX/SRV records)
hickory-resolver = { version = "0.25", default-features = false, features = ["system-config", "tokio"] }
# HTTP client for fetching autoconfig XML from provider servers
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[patch.crates-io]
freya-html = { path = "freya-html-patch" }

[package.metadata.deb]
maintainer = "Zytronium <zytronium@zytronium.dev>"
copyright = "2026, Zytronium"
license-file = ["LICENSE", "4"]
section = "email"
priority = "optional"
depends = "$auto"
extended-description = "Browse and send email at lightspeed with Photon Mail"

[package.metadata.generate-rpm]
packager = "Zytronium <zytronium@zytronium.dev>"
license = "MIT"

[package.metadata.wix]
upgrade-guid = "{37afb898-31eb-4598-b006-b5fd77fee273}"
