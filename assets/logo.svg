<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#1d0a40"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad) #120a35"/>

  <!-- speed trails -->
  <rect x="34" y="214" width="110" height="12" rx="6" fill="url(#trailGrad) #22d3ee"/>
  <rect x="58" y="264" width="96" height="12" rx="6" fill="url(#trailGrad) #22d3ee" opacity="0.8"/>
  <rect x="22" y="314" width="122" height="12" rx="6" fill="url(#trailGrad) #22d3ee" opacity="0.9"/>

  <!-- subtle envelope glow (layered, no filters) -->
  <rect x="106" y="146" width="348" height="248" rx="46" fill="#a855f7" fill-opacity="0.04"/>
  <rect x="116" y="156" width="328" height="228" rx="36" fill="#a855f7" fill-opacity="0.07"/>
  <rect x="123" y="163" width="314" height="214" rx="29" fill="#a855f7" fill-opacity="0.12"/>

  <!-- envelope body -->
  <rect x="130" y="170" width="300" height="200" rx="22" fill="#5b21b6"/>
  <!-- bottom folds -->
  <path d="M140 360 L238 276 M420 360 L322 276" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="10" stroke-linecap="round"/>
  <!-- flap -->
  <path d="M140 180 L280 298 L420 180" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- photon spark -->
  <path d="M190 54 Q196 102 246 108 Q196 114 190 162 Q184 114 134 108 Q184 102 190 54 Z" fill="#ffffff"/>
  <circle cx="262" cy="70" r="7" fill="#b9f6ff"/>
  <circle cx="130" cy="64" r="5" fill="#d9b8ff"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
